name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # TensorFlow wheels are not published for every Python version;
        # run the heavy integration tests on a subset.
        include:
          - python-version: "3.11"
            run-tf-tests: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install TensorFlow (integration subset)
        if: matrix.run-tf-tests == 'true'
        run: python -m pip install "tensorflow>=2.14" "keras>=3.0"

      - name: Build Cython extensions (optional)
        run: python setup.py build_ext --inplace || true

      - name: Run test suite
        env:
          QF_RUN_TF_TESTS: ${{ matrix.run-tf-tests == 'true' && '1' || '0' }}
        run: pytest tests/ -q --tb=short
